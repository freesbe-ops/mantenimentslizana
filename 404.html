<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script>
    // Per a SPA amb GitHub Pages, redirigeix a index.html mantenint la ruta
    const pathname = location.pathname;
    const search = location.search;
    const hash = location.hash;
    
    // Guarda la ruta original
    sessionStorage.redirect = pathname + search + hash;
    
    // Redirigeix a index.html
    window.location.href = '/index.html';
  </script>
</head>
<body></body>
</html>
